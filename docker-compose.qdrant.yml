services:
  qdrant:
    # 固定版本便于复现；升级前先在测试环境验证 Spring AI 客户端兼容性。
    image: qdrant/qdrant:v1.18.2
    container_name: goshop-qdrant
    restart: unless-stopped
    ports:
      # 只监听本机，避免无意中把未配置 TLS 的开发实例暴露到局域网。
      # 本机 6333 可能被其他开发服务占用，默认把 Dashboard/REST 映射到 16333。
      - "127.0.0.1:${QDRANT_HTTP_BIND_PORT:-16333}:6333"
      - "127.0.0.1:6334:6334"
    environment:
      # 本地开发也启用 API Key；应用使用同一个 QDRANT_API_KEY 环境变量。
      QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY:?QDRANT_API_KEY must be set}"
    volumes:
      # Windows Docker Desktop 使用命名卷，避免宿主目录挂载的文件系统兼容问题。
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
    name: goshop_qdrant_storage
